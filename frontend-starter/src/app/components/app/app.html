<mat-toolbar class="app-toolbar" role="banner">
  <div class="brand" routerLink="/tracks" role="button" tabindex="0" aria-label="Accueil Guitar Practice Cloud">
    <div class="brand-icon-wrapper">
      <mat-icon class="brand-icon">graphic_eq</mat-icon>
    </div>
    <div class="brand-text">
      <span class="brand-title">Guitar Practice Cloud</span>
      <span class="brand-subtitle">Le cloud qui manque à votre ampli</span>
    </div>
  </div>

  <span class="toolbar-spacer"></span>

  <nav class="nav-links" aria-label="Navigation principale">
    <a
      mat-button
      routerLink="/tracks"
      routerLinkActive="active-nav-link"
      class="nav-btn"
    >
      <mat-icon class="nav-icon">queue_music</mat-icon>
      <span class="nav-label">Backing tracks</span>
    </a>

    <a
      mat-button
      routerLink="/profile"
      routerLinkActive="active-nav-link"
      class="nav-btn"
    >
      <mat-icon class="nav-icon">person</mat-icon>
      <span class="nav-label">Profil</span>
    </a>

    @if (auth.isAuthenticated()) {
      <button
        type="button"
        mat-flat-button
        class="auth-btn logout-btn"
        (click)="logout()"
        aria-label="Se déconnecter"
      >
        <mat-icon class="nav-icon">logout</mat-icon>
        <span class="nav-label">Déconnexion</span>
      </button>
    } @else {
      <a
        mat-flat-button
        routerLink="/login"
        routerLinkActive="active-nav-link"
        class="auth-btn login-btn"
      >
        <mat-icon class="nav-icon">login</mat-icon>
        <span class="nav-label">Connexion</span>
      </a>
    }

    <div
      class="theme-toggle-container"
      [attr.title]="themeService.isDarkMode() ? 'Passer en mode clair' : 'Passer en mode sombre'"
    >
      <mat-icon class="theme-icon sun-icon" [class.active]="!themeService.isDarkMode()">light_mode</mat-icon>
      <mat-slide-toggle
        [checked]="themeService.isDarkMode()"
        (change)="themeService.setDarkMode($event.checked)"
        aria-label="Basculer le mode sombre"
        class="theme-slider"
      ></mat-slide-toggle>
      <mat-icon class="theme-icon moon-icon" [class.active]="themeService.isDarkMode()">dark_mode</mat-icon>
    </div>
  </nav>
</mat-toolbar>

<main>
  <router-outlet />
</main>
